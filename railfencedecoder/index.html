<style>

}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f8fafc;
    color: #172033;

header {

    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    padding: 0 30px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 5px rgba(0,0,0,.04);
}

.header-link {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: #172033;
}

.logo {
    width: 42px;
    height: 42px;
    object-fit: contain;
    border-radius: 9px;
}

.brand {
    font-size: 21px;
    font-weight: 700;
}

.brand span {
    color: #6B7278;
}

.banner {
    width: 100%;
    height: 220px;

    background:
        linear-gradient(
            rgba(191, 201, 255, .13),
            rgba(109, 108, 145, .36)
        ),
        url("https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/encodergurubanner.png.png");

    background-size: cover;
    background-position: center;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    color: white;
}

.banner h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: -1px;
}

.banner p {
    margin: 10px 0 0;
    font-size: 17px;
}

main {
    max-width: 900px;
    margin: 45px auto;
    padding: 0 22px;
}

.editor-title {
    font-size: 25px;
    font-weight: 700;
    margin-bottom: 8px;
}

.description {
    color: #64748b;
    margin: 0 0 22px;
    font-size: 15px;
}

textarea {
    width: 100%;
    min-height: 210px;
    padding: 16px;

    resize: vertical;

    border: 1px solid #d8dee9;
    border-radius: 10px;

    background: #fff;
    color: #172033;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.5;

    outline: none;

    transition: border-color .2s, box-shadow .2s;
}

textarea:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.10);
}

textarea::placeholder {
    color: #94a3b8;
}

#outputContainer {
    display: none;
    margin-top: 25px;
}

.output-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 9px;
}

#output {
    min-height: 160px;
}

.buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 20px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: background .2s, transform .15s;
}

button:hover {
    transform: translateY(-1px);
}

.decode {
    background: #2563eb;
    color: white;
}

.decode:hover {
    background: #1d4ed8;
}

.encode {
    background: #dbeafe;
    color: #1d4ed8;
}

.encode:hover {
    background: #bfdbfe;
}

.clear {
    background: #eef2f7;
    color: #475569;
}

.clear:hover {
    background: #e2e8f0;
}

.customization {
    margin-top: 30px;
    border-top: 1px solid #e5e7eb;
    padding-top: 24px;
}

.customization-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 15px;
}

.option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;

    padding: 12px 0;

    border-bottom: 1px solid #eef1f5;
}

.option:last-child {
    border-bottom: none;
}

.option-label {
    color: #475569;
    font-size: 15px;
}

input {
    min-width: 220px;

    padding: 9px 12px;

    border: 1px solid #d8dee9;
    border-radius: 8px;

    background: white;
    color: #172033;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;

    outline: none;
}

input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.10);
}

footer {
    text-align: center;
    padding: 35px 20px;
    color: #94a3b8;
    font-size: 14px;
}

@media (max-width: 600px) {

    header {
        padding: 0 17px;
    }

    .brand {
        font-size: 18px;
    }

    .banner {
        height: 185px;
    }

    .banner h1 {
        font-size: 32px;
    }

    .banner p {
        font-size: 15px;
    }

    main {
        margin-top: 30px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .option {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
    }

    input {
        width: 100%;
    }
}
</style>

</head>

<body>

<header>

<a
    class="header-link"
    href="https://encoderguru.github.io"
>

<img
    class="logo"
    src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/encoderguru.png"
    alt="EncoderGuru"
>

<div class="brand">
    Encoder<span>Guru</span>
</div>

</a>

</header>


<section class="banner">

<div>

<h1>Rail Fence Decoder</h1>

<p>
Decrypt text using a zigzag rail pattern
</p>

</div>

</section>


<main>

<div class="editor-title">
    Enter your encrypted text
</div>

<p class="description">
    Type or paste the Rail Fence ciphertext you want to decode.
</p>

<textarea
    id="input"
    placeholder="Enter encrypted text..."
></textarea>


<div id="outputContainer">

<div class="output-title">
    Decoded output
</div>

<textarea
    id="output"
    readonly
></textarea>

</div>


<div class="buttons">

<button
    class="decode"
    onclick="decodeText()"
>
    Decode
</button>

<button
    class="encode"
    onclick="openEncoder()"
>
    Encode
</button>

<button
    class="clear"
    onclick="clearText()"
>
    Clear
</button>

</div>


<div class="customization">

<div class="customization-title">
    Customization
</div>


<div class="option">

<div class="option-label">
    Number of rails
</div>

<input
    id="rails"
    type="number"
    min="2"
    max="100"
    value="3"
>

</div>

</div>

</main>


<footer>
© 2026 EncoderGuru
</footer>


<script>

function railFenceDecode(ciphertext, rails) {

    if (
        rails <= 1 ||
        ciphertext.length <= 1
    ) {
        return ciphertext;
    }


    const length =
        ciphertext.length;


    /*
    Create the zigzag pattern
    that the encoder used
    */

    const pattern = [];

    let row = 0;
    let direction = 1;


    for (
        let i = 0;
        i < length;
        i++
    ) {

        pattern.push(row);


        if (row === 0) {
            direction = 1;
        }

        else if (row === rails - 1) {
            direction = -1;
        }


        row += direction;
    }


    /*
    Count how many characters
    belong to each rail.
    */

    const counts =
        Array(rails).fill(0);


    for (const rail of pattern) {
        counts[rail]++;
    }


    /*
    Split the ciphertext into
    the individual rails.
    */

    const railCharacters =
        Array.from(
            { length: rails },
            () => []
        );


    let position = 0;


    for (
        let rail = 0;
        rail < rails;
        rail++
    ) {

        railCharacters[rail] =
            ciphertext.slice(
                position,
                position + counts[rail]
            ).split("");


        position += counts[rail];
    }


    /*
    Read the rails following
    the original zigzag pattern
    */

    const railPositions =
        Array(rails).fill(0);


    let result = "";


    for (const rail of pattern) {

        result +=
            railCharacters[rail][
                railPositions[rail]
            ];


        railPositions[rail]++;
    }


    return result;
}


function decodeText() {

    const input =
        document.getElementById(
            "input"
        ).value;


    if (!input) {
        return;
    }


    let rails =
        Number(
            document.getElementById(
                "rails"
            ).value
        );


    if (
        !Number.isFinite(rails)
    ) {
        rails = 3;
    }


    rails = Math.trunc(rails);


    if (rails < 2) {
        rails = 2;
    }


    if (rails > 100) {
        rails = 100;
    }


    document.getElementById(
        "rails"
    ).value = rails;


    const decoded =
        railFenceDecode(
            input,
            rails
        );


    document.getElementById(
        "output"
    ).value = decoded;


    document.getElementById(
        "outputContainer"
    ).style.display = "block";
}


function openEncoder() {

    window.location.href =
        "/railfenceencoder";
}


function clearText() {

    document.getElementById(
        "input"
    ).value = "";

    document.getElementById(
        "output"
    ).value = "";

    document.getElementById(
        "outputContainer"
    ).style.display = "none";
}


/*
Load data passed from encoder
*/

window.addEventListener(
    "DOMContentLoaded",
    () => {

        const savedData =
            sessionStorage.getItem(
                "railFenceData"
            );


        const savedRails =
            sessionStorage.getItem(
                "railFenceRails"
            );


        if (savedData) {

            document.getElementById(
                "input"
            ).value = savedData;


            if (savedRails) {

                document.getElementById(
                    "rails"
                ).value = savedRails;
            }


            sessionStorage.removeItem(
                "railFenceData"
            );

            sessionStorage.removeItem(
                "railFenceRails"
            );


            decodeText();
        }
    }
);

</script>

</body>
</html>
