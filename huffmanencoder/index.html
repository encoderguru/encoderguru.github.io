<body>

<header>
    <a class="header-link" href="https://encoderguru.github.io">
        <img
    class="logo"
    src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/encoderguru.png"
    alt="EncoderGuru"
>
        <div class="brand">
            Encoder<span>Guru</span>
        </div>
    </a>
</header>

<section class="banner">
    <div>
        <h1>Huffman Encoder</h1>
        <p>Huffman Code is a type a code where you use Binary to represent letters without ambiguity.</p>
    </div>
</section>

<main>

    <div class="editor-title">
        Enter your text
    </div>

    <p class="description">
        Type or paste the text you want to encode.
    </p>

    <textarea
        id="input"
        placeholder="Start typing..."
    ></textarea>

    <div id="outputContainer">

        <div class="output-title">
            Encoded output
        </div>

        <textarea
            id="output"
            readonly
        ></textarea>

    </div>

    <div class="buttons">

        <button class="encode" onclick="encodeText()">
            Encode
        </button>

        <button class="decode" onclick="openDecoder()">
            Decode
        </button>

<button class="clear" onclick="clearText()">
            Clear
        </button>

    </div>

</main>

<footer>
    © 2026 EncoderGuru
</footer>

<script>

/*
the huffman tree
ur gay for reading this
*/

const frequencies = {
    " ": 18000,
    "E": 12702,
    "T": 9056,
    "A": 8167,
    "O": 7507,
    "I": 6966,
    "N": 6749,
    "S": 6327,
    "H": 6094,
    "R": 5987,
    "D": 4253,
    "L": 4025,
    "C": 2782,
    "U": 2758,
    "M": 2406,
    "W": 2360,
    "F": 2228,
    "G": 2015,
    "Y": 1974,
    "P": 1929,
    "B": 1492,
    "V": 978,
    "K": 772,
    "J": 153,
    "X": 150,
    "Q": 95,
    "Z": 74,
    "0": 500,
    "1": 500,
    "2": 500,
    "3": 500,
    "4": 500,
    "5": 500,
    "6": 500,
    "7": 500,
    "8": 500,
    "9": 500,
    ".": 800,
    ",": 600,
    "?": 150,
    "!": 100,
    "'": 200,
    "\"": 250,
    "<": 30,
    ">": 30,
    "/": 150,
    "\\": 30,
    "-": 250,
    "_": 80,
    "(": 100,
    ")": 100,
    "$": 80,
    "[": 30,
    "]": 30,
    "{": 20,
    "}": 20,
    "#": 30,
    "%": 40,
    "^": 10,
    "+": 50,
    "=": 60,
    "*": 40
};


/*
get the tree
*/

function buildHuffmanTree() {

    let nodes = Object.entries(frequencies).map(
        ([char, frequency]) => ({
            char,
            frequency,
            left: null,
            right: null
        })
    );

    while (nodes.length > 1) {

        nodes.sort((a, b) =>
            a.frequency - b.frequency
        );

        const left = nodes.shift();
        const right = nodes.shift();

        nodes.push({
            char: null,
            frequency: left.frequency + right.frequency,
            left,
            right
        });
    }

    return nodes[0];
}


/*
get the cormde
*/

function generateCodes(node, prefix = "", table = {}) {

    if (!node) {
        return table;
    }

    if (node.char !== null) {

        table[node.char] =
            prefix || "0";

        return table;
    }

    generateCodes(
        node.left,
        prefix + "0",
        table
    );

    generateCodes(
        node.right,
        prefix + "1",
        table
    );

    return table;
}


const huffmanTree = buildHuffmanTree();
const huffmanCodes = generateCodes(huffmanTree);


/*
encodeee
*/

function encodeText() {

    const input =
        document.getElementById("input").value;

    if (!input) {
        return;
    }

    let encoded = "";

    for (const character of input) {

        const normalized =
            character.toUpperCase();

        if (!(normalized in huffmanCodes)) {

            alert(
                "Unsupported character: " +
                JSON.stringify(character)
            );

            return;
        }

        encoded += huffmanCodes[normalized];
    }

    document.getElementById("output").value =
        encoded;

    document.getElementById("outputContainer")
        .style.display = "block";
}


/*
open the decoder
*/

function openDecoder() {

    const encoded =
        document.getElementById("output").value;

    if (encoded) {

        sessionStorage.setItem(
            "huffmanData",
            encoded
        );
    }

    window.location.href =
        "/huffmandecoder";
}


/*
clear!
*/

function clearText() {

    document.getElementById("input").value = "";

    document.getElementById("output").value = "";

    document.getElementById("outputContainer")
        .style.display = "none";
}

</script>

</body>
