        linear-gradient(

            rgba(109, 108, 145, .36)

        url("https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/encodergurubanner.png.png");

.description {

    margin: 0 0 22px;
    font-size: 15px;
}

textarea {
    width: 100%;
    min-height: 210px;
    padding: 16px;

    resize: vertical;

    border: 1px solid #d8dee9;

    font-size: 16px;

}

}

#outputContainer {

}

.output-title {
    font-size: 17px;

}

}

.buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 20px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

.decode {

}

.decode:hover {

}

.encode {

.encode:hover {

}

.clear {
    background: #eef2f7;

.clear:hover {
    background: #e2e8f0;
}

.customization {
    margin-top: 30px;
    border-top: 1px solid #e5e7eb;
    padding-top: 24px;
}

.customization-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 15px;
}

.option {
    padding: 12px 0;
}

.option-label {
    color: #475569;
    font-size: 15px;
    margin-bottom: 8px;
}

select,
input[type="password"] {
    width: 100%;
    padding: 10px 12px;

    border: 1px solid #d8dee9;
    border-radius: 8px;

    background: white;
    color: #172033;

    font-family: Arial, Helvetica, sans-serif;

.help {

<body>

<header>

<a class="header-link" href="https://encoderguru.github.io">

<img
    class="logo"
    src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/encoderguru.png"
    alt="EncoderGuru"
>

<div class="brand">
    Encoder<span>Guru</span>
</div>

</a>

</header>


<section class="banner">

<div>

<h1>Block Cipher Decoder</h1>

<p>
Decrypt AES encrypted text
</p>

</div>

</section>


<main>

<div class="editor-title">
    Enter your encrypted text
</div>

<p class="description">
    Type or paste the AES ciphertext you want to decrypt.
</p>

<textarea
    id="input"
    placeholder="Paste encrypted text here..."
></textarea>


<div id="outputContainer">

<div class="output-title">
    Decoded output
</div>

<textarea
    id="output"
    readonly
></textarea>

</div>


<div class="buttons">

<button class="decode" onclick="decodeText()">
    Decode
</button>

<button class="encode" onclick="openEncoder()">
    Encode
</button>

<button class="clear" onclick="clearText()">
    Clear
</button>

</div>


<div class="customization">

<div class="customization-title">
    Customization
</div>


<div class="option">

<div class="option-label">
    Algorithm
</div>

<select id="algorithm">

<option value="AES-128">
    AES-128
</option>

<option value="AES-256">
    AES-256
</option>

</select>

</div>


<div class="option">

<div class="option-label">
    Mode
</div>

<select id="mode">

<option value="CBC">
    CBC
</option>

<option value="CTR">
    CTR
</option>

</select>

</div>


<div class="option">

<div class="option-label">
    Password
</div>

<input
    type="password"
    id="password"
    placeholder="Enter a password"
    autocomplete="off"
>

<div class="help">
    Use the same password that was used during encryption.
</div>

</div>

</div>

</main>


<footer>
© 2026 EncoderGuru
</footer>


<script>

/*
helper
*/

const textDecoder =
    new TextDecoder();


function base64ToBytes(base64) {

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(
            binary.length
        );

    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);
    }

    return bytes;
}


/*
pbk something
*/

async function deriveKey(
    password,
    salt,
    algorithm,
    mode
) {

    const passwordKey =
        await crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(password),
            "PBKDF2",
            false,
            ["deriveKey"]
        );


    const keyLength =
        algorithm === "AES-128"
            ? 128
            : 256;


    return crypto.subtle.deriveKey(

        {
            name: "PBKDF2",
            salt: salt,
            iterations: 100000,
            hash: "SHA-256"
        },

        passwordKey,

        {
            name:
                mode === "CBC"
                    ? "AES-CBC"
                    : "AES-CTR",

            length: keyLength
        },

        false,

        ["decrypt"]
    );
}


/*
the story of d. ko derr
*/

async function decodeText() {

    const input =
        document.getElementById("input").value.trim();

    const password =
        document.getElementById("password").value;

    if (!input) {
        return;
    }

    if (!password) {

        alert(
            "Please enter a password."
        );

        return;
    }


    try {

        /*
        Expected:

        AES128-CBC:salt.iv.ciphertext
        AES256-CTR:salt.iv.ciphertext
        */

        const firstColon =
            input.indexOf(":");


        if (firstColon === -1) {

            throw new Error(
                "Invalid ciphertext format."
            );
        }


        const header =
            input.substring(
                0,
                firstColon
            );


        const payload =
            input.substring(
                firstColon + 1
            );


        const parts =
            payload.split(".");


        if (parts.length !== 3) {

            throw new Error(
                "Invalid ciphertext format."
            );
        }


        const salt =
            base64ToBytes(parts[0]);

        const iv =
            base64ToBytes(parts[1]);

        const ciphertext =
            base64ToBytes(parts[2]);


        /*
       uhh recignize?
        */

        if (header === "AES128-CBC") {

            document.getElementById(
                "algorithm"
            ).value = "AES-128";

            document.getElementById(
                "mode"
            ).value = "CBC";

        }

        else if (header === "AES256-CBC") {

            document.getElementById(
                "algorithm"
            ).value = "AES-256";

            document.getElementById(
                "mode"
            ).value = "CBC";

        }

        else if (header === "AES128-CTR") {

            document.getElementById(
                "algorithm"
            ).value = "AES-128";

            document.getElementById(
                "mode"
            ).value = "CTR";

        }

        else if (header === "AES256-CTR") {

            document.getElementById(
                "algorithm"
            ).value = "AES-256";

            document.getElementById(
                "mode"
            ).value = "CTR";

        }

        else {

            throw new Error(
                "Unknown AES algorithm or mode."
            );
        }


        const algorithm =
            document.getElementById(
                "algorithm"
            ).value;

        const mode =
            document.getElementById(
                "mode"
            ).value;


        const key =
            await deriveKey(
                password,
                salt,
                algorithm,
                mode
            );


        let plaintext;


        if (mode === "CBC") {

            plaintext =
                await crypto.subtle.decrypt(

                    {
                        name: "AES-CBC",
                        iv: iv
                    },

                    key,

                    ciphertext
                );

        } else {

            plaintext =
                await crypto.subtle.decrypt(

                    {
                        name: "AES-CTR",
                        counter: iv,
                        length: 64
                    },

                    key,

                    ciphertext
                );
        }


        document.getElementById("output").value =
            textDecoder.decode(
                plaintext
            );


        document.getElementById(
            "outputContainer"
        ).style.display = "block";


    } catch (error) {

        console.error(error);

        alert(
            "Decryption failed. Check the password and ciphertext."
        );
    }
}


/*
encoder
*/

function openEncoder() {

    const output =
        document.getElementById("output").value;

    if (output) {

        sessionStorage.setItem(
            "blockData",
            output
        );
    }


    sessionStorage.setItem(
        "blockAlgorithm",
        document.getElementById("algorithm").value
    );


    sessionStorage.setItem(
        "blockMode",
        document.getElementById("mode").value
    );


    window.location.href =
        "/blockencoder";
}


/*
clear
*/

function clearText() {

    document.getElementById("input").value = "";

    document.getElementById("output").value = "";

    document.getElementById("outputContainer")
        .style.display = "none";
}


/*
get datta
*/

window.addEventListener(
    "DOMContentLoaded",
    () => {

        const data =
            sessionStorage.getItem(
                "blockData"
            );


        if (data) {

            document.getElementById(
                "input"
            ).value = data;


            sessionStorage.removeItem(
                "blockData"
            );


            /*
            Algorithm and mode are already
            embedded in the ciphertext,
            so decodeText() can determine them.
            */

            decodeText();
        }
    }
);

</script>

</body>
