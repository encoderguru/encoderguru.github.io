<!DOCTYPE html>
<html lang="en">
<head>

<link
    rel="icon"
    type="image/png"
    href="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/encoderguru.png"
>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EncoderGuru - ROT Decoder</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f8fafc;
    color: #172033;
}

header {
    height: 72px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    padding: 0 30px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 5px rgba(0,0,0,.04);
}

.header-link {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: #172033;
}

.logo {
    width: 42px;
    height: 42px;
    object-fit: contain;
    border-radius: 9px;
}

.brand {
    font-size: 21px;
    font-weight: 700;
}

.brand span {
    color: #6B7278;
}

.banner {
    width: 100%;
    height: 220px;

    background:
        linear-gradient(
            rgba(191, 201, 255, .13),
            rgba(109, 108, 145, .36)
        ),
        url("https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/encodergurubanner.png.png");

    background-size: cover;
    background-position: center;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    color: white;
}

.banner h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: -1px;
}

.banner p {
    margin: 10px 0 0;
    font-size: 17px;
}

main {
    max-width: 900px;
    margin: 45px auto;
    padding: 0 22px;
}

.editor-title {
    font-size: 25px;
    font-weight: 700;
    margin-bottom: 8px;
}

.description {
    color: #64748b;
    margin: 0 0 22px;
    font-size: 15px;
}

textarea {
    width: 100%;
    min-height: 210px;
    padding: 16px;

    resize: vertical;

    border: 1px solid #d8dee9;
    border-radius: 10px;

    background: #fff;
    color: #172033;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.5;

    outline: none;

    transition: border-color .2s, box-shadow .2s;
}

textarea:focus,
select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.10);
}

textarea::placeholder {
    color: #94a3b8;
}

#outputContainer {
    display: none;
    margin-top: 25px;
}

.output-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 9px;
}

#output {
    min-height: 160px;
}

.buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 20px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: background .2s, transform .15s;
}

button:hover {
    transform: translateY(-1px);
}

.decode {
    background: #2563eb;
    color: white;
}

.decode:hover {
    background: #1d4ed8;
}

.encode {
    background: #dbeafe;
    color: #1d4ed8;
}

.encode:hover {
    background: #bfdbfe;
}

.clear {
    background: #eef2f7;
    color: #475569;
}

.clear:hover {
    background: #e2e8f0;
}

.customization {
    margin-top: 30px;
    border-top: 1px solid #e5e7eb;
    padding-top: 24px;
}

.customization-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 15px;
}

.option {
    padding: 12px 0;
}

.option-label {
    color: #475569;
    font-size: 15px;
    margin-bottom: 8px;
}

select {
    width: 100%;
    padding: 10px 12px;

    border: 1px solid #d8dee9;
    border-radius: 8px;

    background: white;
    color: #172033;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;

    outline: none;
}

.help {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 7px;
}

footer {
    text-align: center;
    padding: 35px 20px;
    color: #94a3b8;
    font-size: 14px;
}

@media (max-width: 600px) {

    header {
        padding: 0 17px;
    }

    .brand {
        font-size: 18px;
    }

    .banner {
        height: 185px;
    }

    .banner h1 {
        font-size: 32px;
    }

    .banner p {
        font-size: 15px;
    }

    main {
        margin-top: 30px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>

</head>

<body>

<header>

<a class="header-link" href="https://encoderguru.github.io">

<img
    class="logo"
    src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/encoderguru.png"
    alt="EncoderGuru"
>

<div class="brand">
    Encoder<span>Guru</span>
</div>

</a>

</header>


<section class="banner">

<div>

<h1>ROT Decoder</h1>

<p>
Decode ROT13, ROT18, or ROT47 text
</p>

</div>

</section>


<main>

<div class="editor-title">
    Enter your text
</div>

<p class="description">
    Type or paste the ROT-encoded text you want to decode.
</p>

<textarea
    id="input"
    placeholder="Start typing..."
></textarea>


<div id="outputContainer">

<div class="output-title">
    Decoded output
</div>

<textarea
    id="output"
    readonly
></textarea>

</div>


<div class="buttons">

<button class="decode" onclick="decodeText()">
    Decode
</button>

<button class="encode" onclick="openEncoder()">
    Encode
</button>

<button class="clear" onclick="clearText()">
    Clear
</button>

</div>


<div class="customization">

<div class="customization-title">
    Customization
</div>

<div class="option">

<div class="option-label">
    ROT method
</div>

<select id="rotMethod">

<option value="ROT13">
    ROT13
</option>

<option value="ROT18">
    ROT18
</option>

<option value="ROT47">
    ROT47
</option>

</select>

<div class="help">
    Choose the ROT method used for decoding.
</div>

</div>

</div>

</main>


<footer>
© 2026 EncoderGuru
</footer>


<script>

function rot13(character) {

    const code =
        character.charCodeAt(0);

    if (code >= 65 && code <= 90) {

        return String.fromCharCode(
            ((code - 65 + 13) % 26) + 65
        );
    }

    if (code >= 97 && code <= 122) {

        return String.fromCharCode(
            ((code - 97 + 13) % 26) + 97
        );
    }

    return character;
}


function rot5(character) {

    const code =
        character.charCodeAt(0);

    if (code >= 48 && code <= 57) {

        return String.fromCharCode(
            ((code - 48 + 5) % 10) + 48
        );
    }

    return character;
}


function rot47(character) {

    const code =
        character.charCodeAt(0);

    if (code >= 33 && code <= 126) {

        return String.fromCharCode(
            ((code - 33 + 47) % 94) + 33
        );
    }

    return character;
}


function transformText(text, method) {

    let result = "";

    for (const character of text) {

        if (method === "ROT13") {

            result += rot13(character);

        }

        else if (method === "ROT18") {

            result += rot5(
                rot13(character)
            );

        }

        else if (method === "ROT47") {

            result += rot47(character);

        }
    }

    return result;
}


function decodeText() {

    const input =
        document.getElementById("input").value;

    if (!input) {
        return;
    }

    const method =
        document.getElementById("rotMethod").value;

    /*
    All three ROT transformations
    are self-inverse
    */

    const output =
        transformText(
            input,
            method
        );

    document.getElementById("output").value =
        output;

    document.getElementById("outputContainer")
        .style.display = "block";
}


function openEncoder() {

    const output =
        document.getElementById("output").value;

    if (output) {

        sessionStorage.setItem(
            "rotData",
            output
        );
    }

    sessionStorage.setItem(
        "rotMethod",
        document.getElementById("rotMethod").value
    );

    window.location.href =
        "/rotencoder";
}


function clearText() {

    document.getElementById("input").value = "";

    document.getElementById("output").value = "";

    document.getElementById("outputContainer")
        .style.display = "none";
}


window.addEventListener(
    "DOMContentLoaded",
    () => {

        const method =
            sessionStorage.getItem(
                "rotMethod"
            );

        const data =
            sessionStorage.getItem(
                "rotData"
            );


        if (method !== null) {

            document.getElementById(
                "rotMethod"
            ).value = method;
        }


        if (data) {

            document.getElementById(
                "input"
            ).value = data;


            sessionStorage.removeItem(
                "rotMethod"
            );

            sessionStorage.removeItem(
                "rotData"
            );


            decodeText();
        }
    }
);

</script>

</body>
</html>
