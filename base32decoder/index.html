<body>

<header>

<a
    class="header-link"
    href="https://encoderguru.github.io"
>

<img
    class="logo"
    src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/encoderguru.png"
    alt="EncoderGuru"
>

<div class="brand">
    Encoder<span>Guru</span>
</div>

</a>

</header>


<section class="banner">

<div>

<h1>Base32 Decoder</h1>

<p>
Decode Base32 back into text
</p>

</div>

</section>


<main>

<div class="editor-title">
    Enter your Base32
</div>

<p class="description">
    Type or paste the Base32 data you want to decode.
</p>


<textarea
    id="input"
    placeholder="Enter Base32..."
></textarea>


<div id="outputContainer">

<div class="output-title">
    Decoded output
</div>

<textarea
    id="output"
    readonly
></textarea>

</div>


<div class="buttons">

<button
    class="decode"
    onclick="decodeText()"
>
    Decode
</button>

<button
    class="encode"
    onclick="openEncoder()"
>
    Encode
</button>

<button
    class="clear"
    onclick="clearText()"
>
    Clear
</button>

</div>


<div class="customization">

<div class="customization-title">
    Customization
</div>


<div class="option">

<div class="option-label">
    Alphabet
</div>

<select id="alphabet">

<option value="rfc4648">
    RFC 4648
</option>

</select>

</div>


<div class="option">

<div class="option-label">
    Padding
</div>

<select id="padding">

<option value="include">
    Include (=)
</option>

<option value="none">
    No padding
</option>

</select>

</div>


<div class="option">

<div class="option-label">
    Decode whitespace
</div>

<select id="whitespace">

<option value="ignore">
    Ignore whitespace
</option>

<option value="reject">
    Reject whitespace
</option>

</select>

</div>

</div>

</main>


<footer>
© 2026 EncoderGuru
</footer>


<script>

const BASE32_ALPHABET =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";


/*
big bite
*/

function base32ToBytes(input) {

    const whitespaceMode =
        document.getElementById(
            "whitespace"
        ).value;


    /*
    Automatically accept uppercase
    and lowercase Base32
    */

    input =
        input.toUpperCase();


    /*
    Handle whitespace according
    to the selected decoder option
    */

    if (whitespaceMode === "ignore") {

        input =
            input.replace(/\s/g, "");

    } else {

        if (/\s/.test(input)) {

            throw new Error(
                "Whitespace is not allowed."
            );
        }
    }


    /*
equal no equal i dont care
    */


    /*
    Check padding placement
    */

    const firstPadding =
        input.indexOf("=");

    if (firstPadding !== -1) {

        const data =
            input.substring(
                0,
                firstPadding
            );

        const padding =
            input.substring(
                firstPadding
            );


        /*
        Only '=' may appear after
        the first padding character duh
        */

        if (!/^=+$/.test(padding)) {

            throw new Error(
                "Invalid Base32 padding."
            );
        }


        input = data;
    }


    /*
    Validate Base32 alphabet
    */

    if (
        !/^[A-Z2-7]*$/.test(input)
    ) {

        throw new Error(
            "Invalid Base32. Only A-Z and 2-7 are allowed."
        );
    }


    /*
    Base32 strings cannot have
    impossible lengths

    A remainder of 1 is impossible
    */

    if (input.length % 8 === 1) {

        throw new Error(
            "Invalid Base32 length."
        );
    }


    let buffer = 0;
    let bits = 0;

    const bytes = [];


    for (const character of input) {

        const value =
            BASE32_ALPHABET.indexOf(
                character
            );


        if (value === -1) {

            throw new Error(
                "Invalid Base32 character."
            );
        }


        buffer =
            (buffer << 5) | value;

        bits += 5;


        while (bits >= 8) {

            bits -= 8;

            bytes.push(
                (buffer >> bits) & 255
            );
        }
    }


    /*
the rest is 0
    */

    if (
        bits > 0 &&
        (buffer & ((1 << bits) - 1)) !== 0
    ) {

        throw new Error(
            "Invalid Base32 padding or unused bits."
        );
    }


    return new Uint8Array(bytes);
}


/*
to text
*/

function bytesToText(bytes) {

    try {

        return new TextDecoder(
            "utf-8",
            {
                fatal: true
            }
        ).decode(bytes);

    } catch {

        throw new Error(
            "The decoded data is not valid UTF-8 text."
        );
    }
}


/*
Decide it finally
*/

function decodeText() {

    const input =
        document.getElementById("input").value;

    if (!input) {
        return;
    }


    try {

        const bytes =
            base32ToBytes(input);

        const decoded =
            bytesToText(bytes);


        document.getElementById("output").value =
            decoded;

        document.getElementById("outputContainer")
            .style.display = "block";

    } catch (error) {

        alert(
            "Unable to decode Base32.\n\n" +
            error.message
        );
    }
}


/*
Open it
*/

function openEncoder() {

    window.location.href =
        "/base32encoder";
}


/*
clear!
*/

function clearText() {

    document.getElementById("input").value = "";

    document.getElementById("output").value = "";

    document.getElementById("outputContainer")
        .style.display = "none";
}


/*
speinkle sprinkle mister car get data from encoder
*/

window.addEventListener(
    "DOMContentLoaded",
    () => {

        const savedData =
            sessionStorage.getItem(
                "base32Data"
            );


        if (savedData) {

            document.getElementById(
                "input"
            ).value = savedData;


            sessionStorage.removeItem(
                "base32Data"
            );


            decodeText();
        }
    }
);

</script>

</body>
