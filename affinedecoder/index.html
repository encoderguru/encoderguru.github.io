<!DOCTYPE html>
<html lang="en">
<head>

<link
    rel="icon"
    type="image/png"
    href="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/encoderguru.png"
>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EncoderGuru - Affine Decoder</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f8fafc;
    color: #172033;
}

header {
    height: 72px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    padding: 0 30px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 5px rgba(0,0,0,.04);
}

.header-link {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: #172033;
}

.logo {
    width: 42px;
    height: 42px;
    object-fit: contain;
    border-radius: 9px;
}

.brand {
    font-size: 21px;
    font-weight: 700;
}

.brand span {
    color: #6B7278;
}

.banner {
    width: 100%;
    height: 220px;

    background:
        linear-gradient(
            rgba(191, 201, 255, .13),
            rgba(109, 108, 145, .36)
        ),
        url("https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/encodergurubanner.png.png");

    background-size: cover;
    background-position: center;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    color: white;
}

.banner h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: -1px;
}

.banner p {
    margin: 10px 0 0;
    font-size: 17px;
}

main {
    max-width: 900px;
    margin: 45px auto;
    padding: 0 22px;
}

.editor-title {
    font-size: 25px;
    font-weight: 700;
    margin-bottom: 8px;
}

.description {
    color: #64748b;
    margin: 0 0 22px;
    font-size: 15px;
}

textarea {
    width: 100%;
    min-height: 210px;
    padding: 16px;

    resize: vertical;

    border: 1px solid #d8dee9;
    border-radius: 10px;

    background: #fff;
    color: #172033;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.5;

    outline: none;

    transition: border-color .2s, box-shadow .2s;
}

textarea:focus,
select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.10);
}

textarea::placeholder {
    color: #94a3b8;
}

#outputContainer {
    display: none;
    margin-top: 25px;
}

.output-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 9px;
}

#output {
    min-height: 160px;
}

.buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 20px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: background .2s, transform .15s;
}

button:hover {
    transform: translateY(-1px);
}

.decode {
    background: #2563eb;
    color: white;
}

.decode:hover {
    background: #1d4ed8;
}

.encode {
    background: #dbeafe;
    color: #1d4ed8;
}

.encode:hover {
    background: #bfdbfe;
}

.clear {
    background: #eef2f7;
    color: #475569;
}

.clear:hover {
    background: #e2e8f0;
}

.customization {
    margin-top: 30px;
    border-top: 1px solid #e5e7eb;
    padding-top: 24px;
}

.customization-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 15px;
}

.option {
    padding: 12px 0;
}

.option-label {
    color: #475569;
    font-size: 15px;
    margin-bottom: 8px;
}

select {
    width: 100%;
    padding: 10px 12px;

    border: 1px solid #d8dee9;
    border-radius: 8px;

    background: white;
    color: #172033;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;

    outline: none;
}

.help {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 7px;
}

footer {
    text-align: center;
    padding: 35px 20px;
    color: #94a3b8;
    font-size: 14px;
}

@media (max-width: 600px) {

    header {
        padding: 0 17px;
    }

    .brand {
        font-size: 18px;
    }

    .banner {
        height: 185px;
    }

    .banner h1 {
        font-size: 32px;
    }

    .banner p {
        font-size: 15px;
    }

    main {
        margin-top: 30px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>

</head>

<body>

<header>

<a class="header-link" href="https://encoderguru.github.io">

<img
    class="logo"
    src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/encoderguru.png"
    alt="EncoderGuru"
>

<div class="brand">
    Encoder<span>Guru</span>
</div>

</a>

</header>


<section class="banner">

<div>

<h1>Affine Decoder</h1>

<p>
Decode text using the Affine cipher
</p>

</div>

</section>


<main>

<div class="editor-title">
    Enter your text
</div>

<p class="description">
    Type or paste the Affine ciphertext you want to decode.
</p>

<textarea
    id="input"
    placeholder="Start typing..."
></textarea>


<div id="outputContainer">

<div class="output-title">
    Decoded output
</div>

<textarea
    id="output"
    readonly
></textarea>

</div>


<div class="buttons">

<button class="decode" onclick="decodeText()">
    Decode
</button>

<button class="encode" onclick="openEncoder()">
    Encode
</button>

<button class="clear" onclick="clearText()">
    Clear
</button>

</div>


<div class="customization">

<div class="customization-title">
    Customization
</div>


<div class="option">

<div class="option-label">
    A — Multiplicative key
</div>

<select id="keyA">

<option value="1">1</option>
<option value="3">3</option>
<option value="5">5</option>
<option value="7">7</option>
<option value="9">9</option>
<option value="11">11</option>
<option value="15">15</option>
<option value="17">17</option>
<option value="19">19</option>
<option value="21">21</option>
<option value="23">23</option>
<option value="25">25</option>

</select>

<div class="help">
    Only values that have a multiplicative inverse modulo 26 are available.
</div>

</div>


<div class="option">

<div class="option-label">
    B — Additive key
</div>

<select id="keyB">

<option value="0">0</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>
<option value="11">11</option>
<option value="12">12</option>
<option value="13">13</option>
<option value="14">14</option>
<option value="15">15</option>
<option value="16">16</option>
<option value="17">17</option>
<option value="18">18</option>
<option value="19">19</option>
<option value="20">20</option>
<option value="21">21</option>
<option value="22">22</option>
<option value="23">23</option>
<option value="24">24</option>
<option value="25">25</option>

</select>

</div>

</div>

</main>


<footer>
© 2026 EncoderGuru
</footer>


<script>

function modInverse(a, m) {

    for (
        let x = 1;
        x < m;
        x++
    ) {

        if (
            (a * x) % m === 1
        ) {

            return x;
        }
    }

    return null;
}


function decodeAffine(text, a, b) {

    const inverse =
        modInverse(a, 26);

    if (inverse === null) {

        throw new Error(
            "Invalid A value."
        );
    }


    let result = "";


    for (const character of text) {

        const code =
            character.charCodeAt(0);


        if (
            code >= 65 &&
            code <= 90
        ) {

            const y =
                code - 65;

            let decrypted =
                inverse * (y - b);

            decrypted =
                ((decrypted % 26) + 26) % 26;

            result += String.fromCharCode(
                decrypted + 65
            );

        }

        else if (
            code >= 97 &&
            code <= 122
        ) {

            const y =
                code - 97;

            let decrypted =
                inverse * (y - b);

            decrypted =
                ((decrypted % 26) + 26) % 26;

            result += String.fromCharCode(
                decrypted + 97
            );

        }

        else {

            result += character;
        }
    }


    return result;
}


function decodeText() {

    const input =
        document.getElementById("input").value;

    if (!input) {
        return;
    }


    const a =
        Number(
            document.getElementById("keyA").value
        );

    const b =
        Number(
            document.getElementById("keyB").value
        );


    try {

        const output =
            decodeAffine(
                input,
                a,
                b
            );


        document.getElementById("output").value =
            output;

        document.getElementById("outputContainer")
            .style.display = "block";


    } catch (error) {

        alert(
            "Unable to decode."
        );
    }
}


function openEncoder() {

    const output =
        document.getElementById("output").value;

    if (output) {

        sessionStorage.setItem(
            "affineData",
            output
        );
    }


    sessionStorage.setItem(
        "affineA",
        document.getElementById("keyA").value
    );


    sessionStorage.setItem(
        "affineB",
        document.getElementById("keyB").value
    );


    window.location.href =
        "/affineencoder";
}


function clearText() {

    document.getElementById("input").value = "";

    document.getElementById("output").value = "";

    document.getElementById("outputContainer")
        .style.display = "none";
}


window.addEventListener(
    "DOMContentLoaded",
    () => {

        const data =
            sessionStorage.getItem(
                "affineData"
            );

        const savedA =
            sessionStorage.getItem(
                "affineA"
            );

        const savedB =
            sessionStorage.getItem(
                "affineB"
            );


        if (savedA) {

            document.getElementById(
                "keyA"
            ).value = savedA;
        }


        if (savedB) {

            document.getElementById(
                "keyB"
            ).value = savedB;
        }


        if (data) {

            document.getElementById(
                "input"
            ).value = data;


            sessionStorage.removeItem(
                "affineData"
            );

            sessionStorage.removeItem(
                "affineA"
            );

            sessionStorage.removeItem(
                "affineB"
            );


            decodeText();
        }
    }
);

</script>

</body>
</html>
