<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f8fafc;
    color: #172033;

    display: flex;
    align-items: center;
    padding: 0 30px;

.brand {

    font-weight: 700;
}

.brand span {
    color: #6B7278;
}

.banner {
    width: 100%;
    height: 220px;

    background:
        linear-gradient(
            rgba(191, 201, 255, .13),
            rgba(109, 108, 145, .36)
        ),
        url("https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/encodergurubanner.png.png");

    background-size: cover;
    background-position: center;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    color: white;
}

.banner h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: -1px;
}

.banner p {
    margin: 10px 0 0;
    font-size: 17px;
}

    max-width: 900px;
    margin: 45px auto;
    padding: 0 22px;
}

.editor-title {
    font-size: 25px;
    font-weight: 700;
    margin-bottom: 8px;
}

.description {
    color: #64748b;
    margin: 0 0 22px;
    font-size: 15px;
}

textarea {
    width: 100%;
    min-height: 210px;
    padding: 16px;

    resize: vertical;

    border: 1px solid #d8dee9;
    border-radius: 10px;

    background: #fff;
    color: #172033;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.5;

    outline: none;

    transition: border-color .2s, box-shadow .2s;
}

textarea:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.10);
}

textarea::placeholder {
    color: #94a3b8;
}

#outputContainer {
    display: none;
    margin-top: 25px;
}

.output-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 9px;
}

#output {
    min-height: 160px;
}

.buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 20px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: background .2s, transform .15s;
}

button:hover {
    transform: translateY(-1px);
}

.decode {
    background: #2563eb;
    color: white;
}

.decode:hover {
    background: #1d4ed8;
}

.encode {
    background: #dbeafe;
    color: #1d4ed8;

.clear {

    border-top: 1px solid #e5e7eb;
    padding-top: 24px;

.customization-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 15px;
}

.option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;

    padding: 12px 0;

    border-bottom: 1px solid #eef1f5;
}

.option:last-child {
    border-bottom: none;
}

.option-label {
    color: #475569;
    font-size: 15px;
}

select {
    min-width: 260px;

    padding: 9px 12px;

    border: 1px solid #d8dee9;
    border-radius: 8px;

    background: white;
    color: #172033;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;

    outline: none;

select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,.10);

footer {
    text-align: center;
    padding: 35px 20px;
    color: #94a3b8;
    font-size: 14px;

    header {
        padding: 0 17px;
    }

    .brand {
        font-size: 18px;
    }

    .banner {
        height: 185px;
    }

    .banner h1 {
        font-size: 32px;
    }

    .banner p {
        font-size: 15px;
    }

    main {
        margin-top: 30px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

    .option {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
    }

    select {
        width: 100%;
        min-width: 0;
    }
}
</style>

</head>

<body>

<header>

<a class="header-link" href="https://encoderguru.github.io">

<img
    class="logo"
    src="https://raw.githubusercontent.com/danieltorres-mhcs/assets/refs/heads/main/encoderguru.png"
    alt="EncoderGuru"
>

<div class="brand">
    Encoder<span>Guru</span>
</div>

</a>

</header>


<section class="banner">

<div>

<h1>Unicode Decoder</h1>

<p>
Convert Unicode code points back into text
</p>

</div>

</section>


<main>

<div class="editor-title">
    Enter your Unicode
</div>

<p class="description">
    Type or paste Unicode code points to decode.
</p>

<textarea
    id="input"
    placeholder="Enter Unicode code points..."
></textarea>


<div id="outputContainer">

<div class="output-title">
    Decoded output
</div>

<textarea
    id="output"
    readonly
></textarea>

</div>


<div class="buttons">

<button
    class="decode"
    onclick="decodeText()"
>
    Decode
</button>

<button
    class="encode"
    onclick="openEncoder()"
>
    Encode
</button>

<button
    class="clear"
    onclick="clearText()"
>
    Clear
</button>

</div>


<div class="customization">

<div class="customization-title">
    Customization
</div>

<div class="option">

<div class="option-label">
    Format
</div>

<select id="format">

<option value="unicode">
    Unicode notation
</option>

<option value="decimal">
    Decimal
</option>

<option value="hex">
    Hexadecimal
</option>

<option value="binary">
    Binary
</option>

<option value="octal">
    Octal
</option>

<option value="ncr-decimal">
    NCR ( Decimal )
</option>

<option value="ncr-hex">
    NCR ( Hexadecimal )
</option>

</select>

</div>

</div>

</main>


<footer>
© 2026 EncoderGuru
</footer>


<script>

function parseCodePoint(value, format) {

    value = value.trim();

    if (!value) {
        return null;
    }

    let number;

    switch (format) {

        case "unicode":

            if (!/^U\+[0-9A-Fa-f]+$/.test(value)) {
                return null;
            }

            number =
                parseInt(
                    value.substring(2),
                    16
                );

            break;


        case "decimal":

            if (!/^\d+$/.test(value)) {
                return null;
            }

            number =
                parseInt(value, 10);

            break;


        case "hex":

            if (!/^[0-9A-Fa-f]+$/.test(value)) {
                return null;
            }

            number =
                parseInt(value, 16);

            break;


        case "binary":

            if (!/^[01]+$/.test(value)) {
                return null;
            }

            number =
                parseInt(value, 2);

            break;


        case "octal":

            if (!/^[0-7]+$/.test(value)) {
                return null;
            }

            number =
                parseInt(value, 8);

            break;


        case "ncr-decimal":

            if (!/^&#\d+;$/.test(value)) {
                return null;
            }

            number =
                parseInt(
                    value.slice(2, -1),
                    10
                );

            break;


        case "ncr-hex":

            if (!/^&#x[0-9A-Fa-f]+;$/i.test(value)) {
                return null;
            }

            number =
                parseInt(
                    value.slice(3, -1),
                    16
                );

            break;


        default:
            return null;
    }


    /*
    Unicode scalar values cannot be surrogate
    code points or values above U+10FFFF
    */

    if (
        !Number.isInteger(number) ||
        number < 0 ||
        number > 0x10FFFF ||
        (number >= 0xD800 && number <= 0xDFFF)
    ) {
        return null;
    }

    return number;
}


function decodeText() {

    const input =
        document.getElementById("input").value;

    if (!input.trim()) {
        return;
    }

    const format =
        document.getElementById("format").value;

    /*
    Code points produced by the encoder are
    separated by spaces
    */

    const values =
        input.trim().split(/\s+/);

    let decoded = "";

    for (const value of values) {

        const codePoint =
            parseCodePoint(
                value,
                format
            );

        if (codePoint === null) {

            alert(
                "Invalid Unicode code point: " +
                value
            );

            return;
        }

        decoded +=
            String.fromCodePoint(codePoint);
    }


    document.getElementById("output").value =
        decoded;

    document.getElementById("outputContainer")
        .style.display = "block";
}


function openEncoder() {

    window.location.href =
        "/unicodeencoder";
}


function clearText() {

    document.getElementById("input").value = "";

    document.getElementById("output").value = "";

    document.getElementById("outputContainer")
        .style.display = "none";
}


window.addEventListener(
    "DOMContentLoaded",
    () => {

        const savedData =
            sessionStorage.getItem(
                "unicodeData"
            );

        const savedFormat =
            sessionStorage.getItem(
                "unicodeFormat"
            );

        if (savedFormat) {

            document.getElementById(
                "format"
            ).value = savedFormat;
        }

        if (savedData) {

            document.getElementById(
                "input"
            ).value = savedData;

            sessionStorage.removeItem(
                "unicodeData"
            );

            sessionStorage.removeItem(
                "unicodeFormat"
            );

            decodeText();
        }
    }
);

</script>

</body>
</html>
